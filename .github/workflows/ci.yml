name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API schema is current
        run: npm run gen:api:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Includes scripts/check-dist.mjs: CSP-safe output, no mock API.
      - run: npm run build
      # The router plugin regenerates src/routeTree.gen.ts during the build.
      - name: Route tree is current
        run: git diff --exit-code src/routeTree.gen.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  # Phase 1b gate C1: the production UI against a real ferricade and Postgres
  # (the Docker image, built from this commit), with rdsim as the fleet.
  live:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # Builds the image, starts the stack, runs e2e-live/, removes the stack.
      - run: npm run e2e:live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-live
          path: |
            web/playwright-report-live
            web/test-results-live

  go:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The built UI, so go:embed (web/assets.go) carries it into the tests and the binary.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
      - name: sqlc diff
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o bin/ ./cmd/...
