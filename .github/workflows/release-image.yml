name: Release image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The Dockerfile cross-compiles, so arm64 needs no QEMU.
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag and branch
        id: release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing release: $tag is not v<semver>" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing release: $tag is not on main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: VERSION=${{ steps.release.outputs.version }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ghcr.io/dottio123/ferricade:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.stable == 'true' && 'ghcr.io/dottio123/ferricade:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/dottio123/ferricade
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ferricade
          cache-from: type=gha
          cache-to: type=gha,mode=max
