name: Release image

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # The Dockerfile cross-compiles, so arm64 needs no QEMU.
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release tag and branch
        id: release
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing release: $tag is not v<semver>" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "refusing release: $tag is not on main" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: VERSION=${{ steps.release.outputs.version }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ghcr.io/dottio123/ferricade:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.stable == 'true' && 'ghcr.io/dottio123/ferricade:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/dottio123/ferricade
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ferricade
          cache-from: type=gha
          cache-to: type=gha,mode=max
