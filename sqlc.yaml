version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: inet
            go_type: net/netip.Addr
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
        rename:
          ip: IP
          actor_ip: ActorIP
          client_ip: ClientIP
          rd_session_id: RDSessionID
          uuid: UUID
          os: OS
          cpu: CPU
          csrf_token: CSRFToken
          mfa_passed: MFAPassed
          totp_secret_enc: TOTPSecretEnc
          totp_required: TOTPRequired
          totp_last_step: TOTPLastStep
          os_pattern: OSPattern
          tag_ids: TagIDs
          device_ids: DeviceIDs
